<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#102542" />
      <stop offset="55%" stopColor="#0B192C" />
      <stop offset="100%" stopColor="#050B14" />
    </radialGradient>

    <!-- Outer Electric Glow Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="50%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#00F5D4" />
    </linearGradient>

    <!-- Layer 1: Navy Pillar -->
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0E2442" />
      <stop offset="100%" stopColor="#1B3B6F" />
    </linearGradient>

    <!-- Layer 2: Royal Blue -->
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>

    <!-- Layer 3: Vibrant Electric Blue -->
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#00D2FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" floodColor="#000000" floodOpacity="0.6" />
    </filter>

    <clipPath id="circleClip">
      <circle cx="540" cy="540" r="540" />
    </clipPath>
  </defs>

  <!-- Circular Outer Container -->
  <g clip-path="url(#circleClip)">
    <!-- Base Background -->
    <rect width="1080" height="1080" fill="url(#bgGrad)" />

    <!-- Ambient Glow behind logo -->
    <circle cx="540" cy="460" r="320" fill="#0066FF" opacity="0.18" filter="url(#neonGlow)" />
    <circle cx="540" cy="460" r="160" fill="#00D2FF" opacity="0.12" filter="url(#neonGlow)" />

    <!-- Outer Precision Cyber Ring (Accentuates circular profile crop) -->
    <circle cx="540" cy="540" r="516" stroke="url(#ringGrad)" stroke-width="10" opacity="0.9" />
    <circle cx="540" cy="540" r="496" stroke="#00D2FF" stroke-width="2" stroke-dasharray="16 12" opacity="0.35" />

    <!-- Central 3Biru Emblem Mark (Scaled for max visibility on small phone avatars) -->
    <g transform="translate(540, 420) scale(4.4) translate(-50, -50)" filter="url(#subtleShadow)">
      <!-- Layer 1: Base Navy Structure -->
      <path
        d="M 22 18 C 22 14 26 12 29 14 L 68 34 C 71 36 71 40 68 42 L 35 60 C 26 65 14 58 14 48 L 14 28 C 14 22 18 18 22 18 Z"
        fill="url(#layer1)"
        stroke="#1E40AF"
        stroke-width="1"
      />

      <!-- Layer 2: Royal Blue Execution -->
      <path
        d="M 38 35 C 41 33 45 35 45 38 L 45 68 C 45 78 57 84 66 79 L 78 72 C 82 70 86 73 86 77 L 86 80 C 86 86 79 90 73 87 L 34 68 C 30 66 28 62 28 58 L 28 42 C 28 38 32 35 38 35 Z"
        fill="url(#layer2)"
        opacity="0.95"
      />

      <!-- Layer 3: Dynamic Top Electric Wing -->
      <path
        d="M 34 26 L 68 42 C 73 44 76 50 74 55 L 68 68 C 66 72 61 74 57 72 L 40 63 C 35 60 32 55 33 50 L 36 34 C 36 30 31 27 28 29 L 26 30 C 23 31 22 28 24 26 L 30 20 C 31 19 33 19 34 26 Z"
        fill="url(#layer3)"
        filter="url(#neonGlow)"
      />

      <!-- Modern 3-Dots Signature Accent -->
      <circle cx="28" cy="80" r="4.2" fill="#00D2FF" opacity="0.8" />
      <circle cx="48" cy="88" r="4.5" fill="#2563EB" />
      <circle cx="72" cy="50" r="5" fill="#00D2FF" filter="url(#neonGlow)" />
    </g>

    <!-- Typography: 3Biru Brand Name (Bold, High Contrast, Legible on Mobile) -->
    <g transform="translate(540, 785)">
      <!-- Main "3Biru" text -->
      <text
        x="0"
        y="0"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="112"
        letter-spacing="-2"
      >
        <tspan fill="#00D2FF" filter="url(#neonGlow)">3</tspan>
        <tspan fill="#FFFFFF">Biru</tspan>
      </text>

      <!-- Subtitle: DIGITAL STUDIO -->
      <text
        x="0"
        y="62"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Roboto, 'Segoe UI', sans-serif"
        font-weight="800"
        font-size="28"
        letter-spacing="14"
        fill="#94A3B8"
      >
        DIGITAL STUDIO
      </text>
    </g>

    <!-- Top & Bottom Micro Accent Badges -->
    <circle cx="540" cy="75" r="5" fill="#00D2FF" />
    <circle cx="540" cy="995" r="5" fill="#00D2FF" />
  </g>
</svg>
