<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="iconBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#0F2445" />
      <stop offset="50%" stopColor="#0B192C" />
      <stop offset="100%" stopColor="#040812" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#0066FF" />
    </linearGradient>

    <!-- Layer 1: Navy -->
    <linearGradient id="iLayer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1B36" />
      <stop offset="100%" stopColor="#1E3E62" />
    </linearGradient>

    <!-- Layer 2: Royal Blue -->
    <linearGradient id="iLayer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>

    <!-- Layer 3: Electric Blue -->
    <linearGradient id="iLayer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#00E5FF" />
    </linearGradient>

    <filter id="iGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" floodColor="#000000" floodOpacity="0.75" />
    </filter>

    <clipPath id="circleClipIcon">
      <circle cx="540" cy="540" r="540" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClipIcon)">
    <!-- Base Background -->
    <rect width="1080" height="1080" fill="url(#iconBgGrad)" />

    <!-- Ambient Dynamic Glow -->
    <circle cx="540" cy="540" r="380" fill="#0066FF" opacity="0.22" filter="url(#iGlow)" />
    <circle cx="540" cy="540" r="200" fill="#00D2FF" opacity="0.18" filter="url(#iGlow)" />

    <!-- Outer Profile Circular Cyber Rings -->
    <circle cx="540" cy="540" r="515" stroke="url(#iconRing)" stroke-width="12" opacity="0.95" />
    <circle cx="540" cy="540" r="488" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="24 16" opacity="0.4" />

    <!-- Massive Central Emblem: Maximized for small avatar bubbles in IG/TikTok comments -->
    <g transform="translate(540, 540) scale(6.4) translate(-50, -50)" filter="url(#iShadow)">
      <!-- Layer 1: Navy Foundation -->
      <path
        d="M 22 18 C 22 14 26 12 29 14 L 68 34 C 71 36 71 40 68 42 L 35 60 C 26 65 14 58 14 48 L 14 28 C 14 22 18 18 22 18 Z"
        fill="url(#iLayer1)"
        stroke="#2563EB"
        stroke-width="0.8"
      />

      <!-- Layer 2: Royal Blue Execution -->
      <path
        d="M 38 35 C 41 33 45 35 45 38 L 45 68 C 45 78 57 84 66 79 L 78 72 C 82 70 86 73 86 77 L 86 80 C 86 86 79 90 73 87 L 34 68 C 30 66 28 62 28 58 L 28 42 C 28 38 32 35 38 35 Z"
        fill="url(#iLayer2)"
        opacity="0.95"
      />

      <!-- Layer 3: Top Electric Wing -->
      <path
        d="M 34 26 L 68 42 C 73 44 76 50 74 55 L 68 68 C 66 72 61 74 57 72 L 40 63 C 35 60 32 55 33 50 L 36 34 C 36 30 31 27 28 29 L 26 30 C 23 31 22 28 24 26 L 30 20 C 31 19 33 19 34 26 Z"
        fill="url(#iLayer3)"
        filter="url(#iGlow)"
      />

      <!-- Modern 3-Dots Signature Accent -->
      <circle cx="28" cy="80" r="4.2" fill="#00D2FF" opacity="0.85" />
      <circle cx="48" cy="88" r="4.5" fill="#2563EB" />
      <circle cx="72" cy="50" r="5" fill="#00E5FF" filter="url(#iGlow)" />
    </g>

    <!-- Subtle Brand Wordmark at bottom curved edge -->
    <text
      x="540"
      y="980"
      text-anchor="middle"
      font-family="system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="44"
      letter-spacing="18"
      fill="#64748B"
    >
      3BIRU.ID
    </text>
  </g>
</svg>
