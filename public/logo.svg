    <!-- Top Layer (Electric Blue) -->
    <path d="M 34 26 L 68 42 C 73 44 76 50 74 55 L 68 68 C 66 72 61 74 57 72 L 40 63 C 35 60 32 55 33 50 L 36 34 C 36 30 31 27 28 29 L 26 30 C 23 31 22 28 24 26 L 30 20 C 31 19 33 19 34 26 Z" fill="url(#svgElectric)" filter="url(#svgGlow)" />
    <circle cx="28" cy="80" r="4" fill="#0B192C" />
    <circle cx="48" cy="88" r="4.5" fill="#2563EB" />
    <circle cx="72" cy="50" r="5" fill="#00D2FF" />
  </g>

  <!-- Typography -->
  <text x="125" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#0066FF">3</text>
  <text x="156" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#0B192C">Biru</text>
  <circle cx="272" cy="65" r="4.5" fill="#00D2FF" />
  <text x="127" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="4" fill="#4B6282">DIGITAL STUDIO</text>
