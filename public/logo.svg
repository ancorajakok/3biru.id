      <stop offset="0%" stopColor="#0B192C" />
      <stop offset="100%" stopColor="#1E3E62" />
    </linearGradient>
    <linearGradient id="svgRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>
    <linearGradient id="svgElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0066FF" />
      <stop offset="100%" stopColor="#00D2FF" />
    </linearGradient>
    <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" floodColor="#00D2FF" floodOpacity="0.5" />
