    <path d="M 22 18 C 22 14 26 12 29 14 L 68 34 C 71 36 71 40 68 42 L 35 60 C 26 65 14 58 14 48 L 14 28 C 14 22 18 18 22 18 Z" fill="url(#svgNavy)" />
